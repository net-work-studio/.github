name: Release batches

on:
  schedule:
    - cron: "15 7 * * 1"
      timezone: Europe/Zurich
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft]
  push:
    branches: ["$default-branch", staging, "staging-*"]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: reconcile
        options: [reconcile, bootstrap, rollover]

permissions:
  contents: read

jobs:
  release-batches:
    if: vars.RELEASE_BATCHES_ENABLED == 'true'
    uses: net-work-studio/.github/.github/workflows/release-batches.yml@RELEASE_KIT_COMMIT
    with:
      source-ref: RELEASE_KIT_COMMIT
      app-id: ${{ vars.RELEASE_APP_ID }}
      operation: ${{ github.event_name == 'schedule' && 'rollover' || inputs.operation || 'reconcile' }}
      production-branch: $default-branch
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
